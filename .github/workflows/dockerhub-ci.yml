name: CI Build and Push to Docker Hub

on:
  push:
    branches: [ main, master, develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_NOMBRE }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_NOMBRE }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check required Dockerfiles
      run: |
        echo "Checking required Dockerfiles..."
        if [ ! -f AS241S5_AEJ_45-fe/Dockerfile ]; then echo "Missing AS241S5_AEJ_45-fe/Dockerfile" && exit 1; fi
        if [ ! -f AS241S5_AEJ_45-be/Dockerfile ]; then echo "Missing AS241S5_AEJ_45-be/Dockerfile" && exit 1; fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME_NOMBRE }}
        password: ${{ secrets.DOCKERHUB_TOKEN_NOMBRE }}

    - name: Build backend (Maven)
      working-directory: ./AS241S5_AEJ_45-fe
      run: mvn -B -DskipTests package

    - name: Build and push backend image
      uses: docker/build-push-action@v4
      with:
        context: ./AS241S5_AEJ_45-fe
        file: ./AS241S5_AEJ_45-fe/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME_NOMBRE }}/as241s5_aej_45-be:latest
          ${{ secrets.DOCKERHUB_USERNAME_NOMBRE }}/as241s5_aej_45-be:${{ github.sha }}

    - name: Build frontend (Node)
      working-directory: ./AS241S5_AEJ_45-be
      run: |
        npm ci
        npm run build || true

    - name: Build and push frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./AS241S5_AEJ_45-be
        file: ./AS241S5_AEJ_45-be/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME_NOMBRE }}/as241s5_aej_45-fe:latest
          ${{ secrets.DOCKERHUB_USERNAME_NOMBRE }}/as241s5_aej_45-fe:${{ github.sha }}
